version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: libreria_postgres
    environment:
      POSTGRES_USER: libreria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: libreria_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libreria"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libreria_backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/libreria_db
      DB_USER: libreria
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: libreria_frontend
    depends_on:
      - backend
    networks:
      - app_network
    ports:
      - "3000:8080"

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
