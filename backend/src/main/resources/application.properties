# Configurazione Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/libreria_db
spring.datasource.username=libreria
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Gestione SQL Logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurazione JWT
jwt.secret=${JWT_SECRET:genera_cchiave_random_hex_32_caratteri}
jwt.expires-in=15m
jwt.access-secret=false

# Profili attivi
spring.profiles.active=docker

# Configurazione sicurezza
server.port=8080
security.enabled=true
