# Configurazione Database PostgreSQL (da .env)
spring.datasource.url=jdbc:postgresql://postgres:5432/libreria_db
spring.datasource.username=libreria
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurazione JWT (da .env)
jwt.secret=${JWT_SECRET:genera_random_hex_32_caratteri_hexadecimal}
jwt.expires-in=15m

# Porti di rete interna
server.port=8080

# Sicurezza
security.enabled=true
