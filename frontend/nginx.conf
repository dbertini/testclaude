# Configurazione server web Nginx per frontend
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  text/html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/x-javascript;

    # Configurazione server principale
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html/;
        index index.html index.htm;

        # Gestione routing client-side per Single Page Application
        location = / {
            try_files $uri $uri/ /index.html;
        }

        # Serve files statici direttamente se esistono
        location ~* \.(css|js|html)$ {
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Gestione error page
        error_page 404 /index.html;
    }
}
