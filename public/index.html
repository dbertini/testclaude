<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Libreria Personale</title>
    <link rel="stylesheet" href="/css/base.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <a href="/" class="logo">📚 Libreria Personale</a>
            <nav class="navbar">
                <button id="menu-toggle" class="menu-toggle" aria-label="Menu mobile">☰</button>
                <ul class="nav-links" id="main-nav">
                    <li><a href="/css/index.html#book-list">I Miei Libri</a></li>
                    <li><a href="/js/auth.js#admin">Amministratore</a></li>
                    <li><a href="/js/auth.js#logout">Logout</a></li>
                </ul>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="content" id="app-content">
            <!-- Dynamic content will be loaded here -->
            <section id="welcome-message">
                <h1>Bienvenuto nella tua Libreria Personale</h1>
                <p>Gestisci la tua collezione di libri, autori e case editrici.</p>
                <div class="menu-sections" id="sections-container"></div>
            </section>

            <!-- Sections will be dynamically injected -->
        </main>

        <!-- Modal Auth -->
        <div id="auth-modal" class="modal">
            <div class="modal-content">
                <h2 id="modal-title">Accesso</h2>
                <form id="login-form">
                    <input type="text" name="username" placeholder="Username o email" required />
                    <input type="password" name="password" placeholder="Password" required />
                    <button type="submit">Entra</button>
                    <span id="error-message"></span>
                </form>
            </div>
        </div>

        <!-- Mobile Menu -->
        <aside class="sidebar" id="sidebar">
            <a href="/css/index.html#book-list" target="_self">I Miei Libri</a>
            <a href="/js/auth.js#admin" target="_self">Amministratore</a>
            <a href="/js/auth.js#logout" target="_self">Logout</a>
        </aside>
    </div>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
    <script src="/js/book.js"></script>
    <script src="/js/author.js"></script>
    <script src="/js/publisher.js"></script>
    <script src="/js/position.js"></script>
</body>
</html>
